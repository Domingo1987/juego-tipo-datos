<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TYPE RAID — JS Data Types</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- PANTALLA DE INICIO -->
  <div id="screen-start" class="screen active">
    <div class="glitch-bg"></div>
    <div class="start-content">
      <div class="logo">
        <span class="logo-type">TYPE</span>
        <span class="logo-raid">RAID</span>
      </div>
      <p class="subtitle">¿Conoces los tipos de datos de JavaScript?</p>
      <div class="type-pills">
        <span class="pill string">string</span>
        <span class="pill number">number</span>
        <span class="pill boolean">boolean</span>
        <span class="pill null">null</span>
        <span class="pill undefined">undefined</span>
        <span class="pill object">object</span>
        <span class="pill symbol">symbol</span>
        <span class="pill bigint">bigint</span>
      </div>
      <button id="btn-start" class="btn-primary">INICIAR MISIÓN</button>
      <p class="hint">Selecciona el tipo de dato correcto antes de que la amenaza llegue</p>
    </div>
  </div>

  <!-- PANTALLA DE JUEGO -->
  <div id="screen-game" class="screen">
    <header class="hud">
      <div class="hud-block">
        <span class="hud-label">PUNTOS</span>
        <span id="score" class="hud-val">0</span>
      </div>
      <div class="hud-block center">
        <span class="hud-label">VIDAS</span>
        <div id="lives" class="lives"></div>
      </div>
      <div class="hud-block right">
        <span class="hud-label">NIVEL</span>
        <span id="level" class="hud-val">1</span>
      </div>
    </header>

    <!-- Amenaza actual -->
    <div id="threat-zone">
      <div id="progress-bar"><div id="progress-fill"></div></div>
      <div id="threat-card">
        <div id="threat-code"></div>
        <div id="threat-question">¿Qué tipo de dato es este valor?</div>
      </div>
    </div>

    <!-- Opciones -->
    <div id="options-grid"></div>

    <!-- Feedback -->
    <div id="feedback" class="feedback hidden"></div>

    <!-- Fact -->
    <div id="fact-box" class="fact-box hidden"></div>
  </div>

  <!-- PANTALLA FINAL -->
  <div id="screen-end" class="screen">
    <div class="end-content">
      <div id="end-title" class="end-title"></div>
      <div id="end-score" class="end-score"></div>
      <div id="end-msg" class="end-msg"></div>
      <button id="btn-restart" class="btn-primary">JUGAR DE NUEVO</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
